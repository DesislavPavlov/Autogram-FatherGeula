name: Align VO and build bundle

# Started each morning by Claude's daily task (GitHub's own cron proved unreliable).
on:
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "How many VO jobs to process"
        default: "1"

permissions:
  contents: write

concurrency:
  group: align
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      TORCH_HOME: ${{ github.workspace }}/.torch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg + Python deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Cache MMS_FA aligner model (~1.2 GB)
        uses: actions/cache@v4
        with:
          path: .torch
          key: mms-fa-torch2.8

      - name: Pull inputs from Drive
        run: python pipeline/drive.py pull --work work

      - name: Run notebook (align + bundle)
        run: python pipeline/align_runner.py --work work --max-jobs "${{ inputs.max_jobs || '1' }}"

      - name: Push results to Drive
        if: always() && hashFiles('work/run_result.json') != ''
        run: python pipeline/drive.py push --work work

      - name: Snapshot queue, scripts, ideas and prompts
        if: always()
        run: python pipeline/drive.py status --work /tmp/pub || echo "status snapshot failed"

      - name: Publish status branch (always)
        if: always()
        run: |
          set -e
          mkdir -p /tmp/pub
          [ -f work/run_result.json ] && cp work/run_result.json /tmp/pub/ || echo '{"status":"error","error":"runner produced no run_result.json","created_utc":"'"$(date -u +%FT%TZ)"'"}' > /tmp/pub/run_result.json
          cd /tmp/pub
          git init -q -b status
          git config user.name "autogram-bot"; git config user.email "autogram-bot@users.noreply.github.com"
          git add -A && git commit -q -m "status $(date -u +%F) run ${{ github.run_id }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status

      - name: Publish bundle branch (only when a bundle was built)
        if: always() && hashFiles('work/run_result.json') != ''
        run: |
          set -e
          FILES=$(python -c "import json;print(' '.join(b['zip']+' '+b['kickoff_file'] for b in json.load(open('work/run_result.json'))['bundles']))")
          [ -z "$FILES" ] && { echo "no bundle built; bundles branch left as is"; exit 0; }
          mkdir -p /tmp/bun && cp work/run_result.json /tmp/bun/
          for z in $FILES; do cp "work/bundles/$z" /tmp/bun/; done
          cd /tmp/bun
          git init -q -b bundles
          git config user.name "autogram-bot"; git config user.email "autogram-bot@users.noreply.github.com"
          git add -A && git commit -q -m "bundle $(date -u +%F) run ${{ github.run_id }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bundles
