name: Drive tools

on:
  workflow_dispatch:
    inputs:
      command:
        description: "check | archive | status"
        default: check
      pattern:
        description: "archive: regex of in/ file names to move to in_processed/"
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q google-api-python-client google-auth
      - env:
          CMD: ${{ inputs.command }}
          PATTERN: ${{ inputs.pattern }}
        run: |
          case "$CMD" in archive) python pipeline/drive.py archive --pattern "$PATTERN";; status) python pipeline/drive.py status --work /tmp/st && ls -R /tmp/st;; *) python pipeline/drive.py check;; esac
