name: Drive tools

on:
  workflow_dispatch:
    inputs:
      command:
        description: "check | archive | status | share | unshare | probe"
        default: check
      pattern:
        description: "archive: regex of in/ file names to move to in_processed/"
        default: ""
      file_id:
        description: "share / unshare / probe: Drive file id"
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q google-api-python-client google-auth
      - env:
          CMD: ${{ inputs.command }}
          PATTERN: ${{ inputs.pattern }}
          FILE_ID: ${{ inputs.file_id }}
        run: |
          case "$CMD" in archive) python pipeline/drive.py archive --pattern "$PATTERN";; status) python pipeline/drive.py status --work /tmp/st && ls -R /tmp/st && for f in /tmp/st/prompts/*; do echo "--- $f"; head -c 300 "$f"; echo; done;;
            share|unshare) python pipeline/drive.py "$CMD" --id "$FILE_ID";;
            probe) URL=$(python pipeline/drive.py share --id "$FILE_ID"); sleep 5
                   curl -sSL -o /tmp/v.bin -w "http %{http_code} type %{content_type} bytes %{size_download}\n" "$URL" || true
                   file /tmp/v.bin; python pipeline/drive.py unshare --id "$FILE_ID";; *) python pipeline/drive.py check;; esac
